<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-labelledby="ao-mark-title">
  <title id="ao-mark-title">Askoutfit mark — the outfit hanger that answers</title>

  <defs>
    <linearGradient id="aoGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8cf9c"/>
      <stop offset=".45" stop-color="#caa46a"/>
      <stop offset="1" stop-color="#a8823f"/>
    </linearGradient>
    <radialGradient id="aoPlate" cx=".34" cy=".22" r=".9">
      <stop offset="0" stop-color="#2b221a"/>
      <stop offset="1" stop-color="#181210"/>
    </radialGradient>
  </defs>

  <!-- Monogram plate -->
  <rect x="7" y="7" width="106" height="106" rx="30" fill="url(#aoPlate)" stroke="#3a3026" stroke-width="1.6"/>

  <!-- Hanger hook, curling into a question-mark stem -->
  <path d="M60 34 C60 24 68 20 74 24 C81 28.6 78.5 38 69 40.5 L60 43"
        fill="none" stroke="url(#aoGold)" stroke-width="5.2"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Question-mark dot -->
  <circle cx="60" cy="52.5" r="3.5" fill="url(#aoGold)"/>

  <!-- Hanger shoulders: an uplifting V -->
  <path d="M60 59 L22 79" fill="none" stroke="url(#aoGold)" stroke-width="5.2" stroke-linecap="round"/>
  <path d="M60 59 L98 79" fill="none" stroke="url(#aoGold)" stroke-width="5.2" stroke-linecap="round"/>

  <!-- Garment bar, slightly curved like a worn-in rail -->
  <path d="M27 84.5 C40 81.5 80 81.5 93 84.5" fill="none" stroke="url(#aoGold)" stroke-width="5.2" stroke-linecap="round"/>

  <!-- Style spark: the AI stylist finishing touch -->
  <path d="M97 96 l2.1 4.9 4.9 2.1 -4.9 2.1 -2.1 4.9 -2.1 -4.9 -4.9 -2.1 4.9 -2.1 z" fill="#e8cf9c"/>
</svg>
